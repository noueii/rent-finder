global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'tokyo-apartment-finder'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Scrape application metrics
  - job_name: 'tokyo-apartment-finder'
    static_configs:
      - targets: ['app:9464']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'app'

  # Scrape PostgreSQL exporter if available
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres'

  # Scrape Redis exporter if available
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis'