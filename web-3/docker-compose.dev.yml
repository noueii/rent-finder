version: '3.8'

# Additional development services
# Run with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Prisma Studio for database visualization
  prisma-studio:
    image: node:20-alpine
    container_name: rentfinder-prisma-studio
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/web-3
    command: npx prisma studio
    ports:
      - "5555:5555"
    depends_on:
      - postgres
    profiles:
      - tools

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rentfinder-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools